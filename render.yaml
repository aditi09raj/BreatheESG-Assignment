services:
  - type: web
    name: esg-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt && SECRET_KEY=build-only python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    rootDir: backend
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: esg-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  - type: web
    name: esg-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: esg-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: esg-db
    plan: free
